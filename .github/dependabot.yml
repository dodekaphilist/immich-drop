version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      url-extractors:
        patterns:
          - "yt-dlp*"
          - "gallery-dl"
      python-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "yt-dlp*"
          - "gallery-dl"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "docker"
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    # @immich/ui depends on @sveltejs/kit 2.x; stay on kit 2 and adapter-static 3
    ignore:
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-static"
        update-types: ["version-update:semver-major"]
    groups:
      web-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "javascript"
